<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses API</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Course Manager</h1>

    <div class="card">

        <h2>Create Course</h2>

        <form id="courseForm">

            <input
                type="text"
                id="title"
                placeholder="Course Title"
                required
            >

            <input
                type="number"
                step="0.01"
                id="fee"
                placeholder="Fee"
                required
            >

            <input
                type="number"
                step="0.01"
                id="confirmFee"
                placeholder="Confirm Fee"
                required
            >

            <input
                type="number"
                id="instructor"
                placeholder="Instructor ID"
                required
            >

            <label>
                <input type="checkbox" id="available">
                Available
            </label>

            <button>Create</button>

        </form>

    </div>

    <hr>

    <button id="loadBtn">Load Courses</button>

    <div id="courses"></div>

</div>

<script src="script.js"></script>

</body>
</html>
